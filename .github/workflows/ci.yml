name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Pytest
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite:///./ci_test.db
      CHECKPOINT_DB_URI: postgresql://bank:bank@localhost:5432/bank_support
      OPENAI_API_KEY: test-key-not-used
      MODEL_NAME: gpt-5.6-luna

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Run deterministic tests
        run: python -m pytest -q

  database-smoke:
    name: PostgreSQL migration smoke test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bank
          POSTGRES_PASSWORD: bank
          POSTGRES_DB: bank_support
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bank -d bank_support"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://bank:bank@localhost:5432/bank_support
      CHECKPOINT_DB_URI: postgresql://bank:bank@localhost:5432/bank_support
      OPENAI_API_KEY: test-key-not-used
      MODEL_NAME: gpt-5.6-luna
      LANGGRAPH_STRICT_MSGPACK: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Apply Alembic migrations
        run: alembic upgrade head

      - name: Initialize LangGraph checkpoint tables
        run: python -m app.setup_checkpointer

      - name: Seed synthetic data
        run: python -m app.seed

      - name: Verify models match database schema
        run: alembic check

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build API image
        run: docker build -t bank-support-ai-agent:ci .
